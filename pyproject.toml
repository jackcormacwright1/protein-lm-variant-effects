[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plm"
version = "0.1.0"
description = "Do protein language models know what a mutation does? ESM-2 against ProteinGym"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
models = ["torch>=2.2", "fair-esm>=2.0"]
analysis = ["pymc>=5.10", "arviz>=0.17", "matplotlib>=3.8"]
app = ["streamlit>=1.35", "altair>=5", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
